name: Cloud-Init CI

on:
  push:
    branches:
      - main
    paths:
      - "cloud-init/**"
      - ".github/workflows/cloud-init.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud-init/**"
      - ".github/workflows/cloud-init.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Check yaml lint errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c #3.1.1
        with:
          file_or_dir: cloud-init/