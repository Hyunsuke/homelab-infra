name: Ansible CI

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-check:
    name: Ansible check pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #7.0.0
        with:
          python-version: "3.13"
      - name: Install Ansible
        run: pip install ansible
      - name: Check inventory
        working-directory: ansible
        run: ansible-inventory -i inventory/hosts.ini --graph
      - name: Check k8s setup playbook syntax
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.ini playbooks/k8s-setup.yml --syntax-check
      - name: Check k8s master playbook syntax
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.ini playbooks/k8s-master.yml --syntax-check